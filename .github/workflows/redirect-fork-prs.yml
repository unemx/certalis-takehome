name: Redirect cross-fork PRs

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close-cross-fork:
    if: github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const headRepo = pr.head.repo.full_name;
            const headRef = pr.head.ref;
            const author = pr.user.login;
            const compareUrl = `https://github.com/${headRepo}/compare/main...${headRef}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `Hi @${author} — this PR was opened against the wrong repo. GitHub defaults cross-fork PRs to the upstream parent, but your work should land in your own fork.\n\nRe-open it inside your fork: ${compareUrl}\n\nClosing this one automatically.`,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed',
            });
